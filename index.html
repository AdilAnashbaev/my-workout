<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fitness OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#000; --card:#1C1C1E; --sep:#2C2C2E; --border:#3A3A3C;
  --accent:#0A84FF; --success:#32D74B; --warn:#FF9F0A; --error:#FF453A;
  --text:#FFF; --sec:#8E8E93;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;overscroll-behavior:none}
body{padding:0 0 160px}

/* HEADER */
.top-bar{padding:16px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.top-date{font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.top-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.week-badge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--sec);align-self:center}

/* ���─ PROGRESS BAR TABS ── */
.prog-wrap{padding:14px 16px 0}
.prog-track{
  display:flex;height:44px;border-radius:14px;overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  position:relative;
}
.prog-seg{
  flex:1;border:none;background:transparent;
  color:var(--sec);font-weight:700;font-size:13px;
  cursor:pointer;transition:color .2s;
  position:relative;z-index:1;
  letter-spacing:.3px;
}
.prog-seg.done{color:#000}
.prog-seg.active:not(.done){color:#fff}
.prog-fill{
  position:absolute;top:0;left:0;height:100%;
  background:var(--success);
  border-radius:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  z-index:0;
  pointer-events:none;
}
.prog-seg.active::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;height:2px;
  background:#fff;border-radius:2px 2px 0 0;opacity:.5;
}
.prog-seg.done.active::after{background:#000;opacity:.3}
.prog-seg+.prog-seg{border-left:1px solid var(--border)}
.prog-seg.done+.prog-seg.done{border-left-color:rgba(0,0,0,.15)}

/* SECTION LABELS */
.section-label{font-size:11px;font-weight:700;color:var(--sec);text-transform:uppercase;letter-spacing:.8px;padding:20px 16px 8px}

/* SUPERSET CARD */
.ss-card{margin:0 16px 12px;background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--sep)}
.ss-card.done-card{opacity:.35}
.ss-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--sep)}
.ss-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.ss-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px}
.ss-badge.pending{background:var(--sep);color:var(--sec)}
.ss-badge.active{background:rgba(10,132,255,.15);color:var(--accent);border:1px solid rgba(10,132,255,.3)}
.ss-badge.complete{background:rgba(50,215,75,.15);color:var(--success);border:1px solid rgba(50,215,75,.3)}

/* EXERCISE ROW */
.ex-row{padding:14px 16px;border-bottom:1px solid var(--sep)}
.ex-name{font-size:16px;font-weight:600;margin-bottom:10px}
.ex-controls{display:flex;gap:8px;align-items:center}
.weight-display{flex:1.2;background:var(--sep);border-radius:12px;padding:11px 8px;text-align:center}
.weight-val{font-size:18px;font-weight:700;display:block}
.weight-unit{font-size:10px;color:var(--sec);font-weight:600;letter-spacing:.5px}
.btn-adj{flex:1;background:var(--sep);border:none;border-radius:12px;padding:11px 5px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-adj:active{transform:scale(.95);opacity:.7}
.btn-adj.minus{color:var(--sec)}
.btn-edit{width:44px;height:44px;background:var(--sep);border:none;border-radius:12px;color:var(--sec);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.btn-edit:active{transform:scale(.95)}

/* SET BUTTON */
.set-btn-wrap{padding:12px 16px 16px}
.set-btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.set-btn.ready{background:var(--accent);color:#fff}
.set-btn.ready:active{transform:scale(.98);opacity:.85}
.set-btn.last-set{background:var(--success);color:#000}

/* FINISH BUTTON */
.finish-wrap{padding:0 16px}
.finish-btn{width:100%;border:none;border-radius:18px;padding:18px;font-size:17px;font-weight:700;cursor:pointer;background:var(--success);color:#000;transition:all .15s}
.finish-btn:active{transform:scale(.98)}

/* TIMER PILL */
.timer-pill{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:50%;transform:translateX(-50%);background:#1C1C1E;border:1px solid var(--border);border-radius:100px;display:none;align-items:center;gap:8px;z-index:99;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.timer-left{padding:12px 18px;flex:1}
.timer-label{font-size:10px;font-weight:700;color:var(--sec);text-transform:uppercase;letter-spacing:.8px}
.timer-count{font-size:22px;font-weight:800;color:var(--text);display:block}
.timer-bar{height:3px;background:var(--sep);position:absolute;bottom:0;left:0;right:0}
.timer-bar-fill{height:100%;background:var(--accent);border-radius:0 2px 2px 0}
.timer-skip{padding:0 16px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;align-self:stretch;display:flex;align-items:center;min-height:60px}

/* REPORT */
.report{padding:0 16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--sep)}
.stat-num{font-size:26px;font-weight:800;color:var(--success);letter-spacing:-1px}
.stat-lbl{font-size:11px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* WEEK STATS WIDGET */
.week-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.week-stat-item{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--sep);text-align:center}
.week-stat-value{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px}
.week-stat-label{font-size:10px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* EXERCISE RANKING */
.exercise-ranking{background:var(--card);border-radius:20px;padding:16px;margin:16px 0;border:1px solid var(--sep)}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep);font-size:14px}
.rank-item:last-child{border-bottom:none}
.rank-name{flex:1;font-weight:600}
.rank-change{font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px}
.rank-change.up{background:rgba(50,215,75,.2);color:var(--success)}
.rank-change.down{background:rgba(255,69,58,.2);color:var(--error)}

/* PR NOTIFICATION */
.pr-notification{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border-radius:24px;padding:32px 24px;text-align:center;z-index:999;border:2px solid var(--success);display:none;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.pr-notification.show{display:block}
.pr-icon{font-size:64px;margin-bottom:16px;animation:bounce .6s ease-in-out infinite}
.pr-title{font-size:24px;font-weight:800;color:var(--success);margin-bottom:8px}
.pr-text{font-size:14px;color:var(--sec);margin-bottom:4px}
.pr-value{font-size:28px;font-weight:800;color:var(--success)}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* CHART CARDS */
.chart-card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--sep)}
.chart-title{font-size:13px;font-weight:700;margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--sec);margin-bottom:14px}
.chart-wrap{position:relative;height:120px}

/* NEXT BUTTONS */
.next-btn{width:100%;border:none;border-radius:16px;padding:17px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:10px}
.next-btn.primary{background:var(--accent);color:#fff}
.next-btn.reset{background:var(--card);color:var(--sec);border:1px solid var(--border)}
.next-btn:active{transform:scale(.98)}

/* WEEK END */
.week-end{text-align:center;padding:28px 16px 4px}
.week-end-icon{font-size:44px;margin-bottom:10px}
.week-end-title{font-size:24px;font-weight:800;margin-bottom:6px}
.week-end-sub{font-size:15px;color:var(--sec);margin-bottom:20px}

/* UNDO TOAST */
.undo-toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);left:16px;right:16px;background:#3A3A3C;border-radius:14px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;gap:8px;z-index:98}
.undo-text{font-size:14px;font-weight:500}
.undo-btn{background:transparent;border:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;padding:0;white-space:nowrap}

/* OVERLAY */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:997}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="pr-notification" id="pr-notification">
  <div class="pr-icon">🔥</div>
  <div class="pr-title">НОВЫЙ РЕКОРД!</div>
  <div class="pr-text" id="pr-exercise"></div>
  <div class="pr-value" id="pr-weight"></div>
</div>

<div class="timer-pill" id="timer-pill">
  <div class="timer-left">
    <div class="timer-label">Отдых</div>
    <span class="timer-count" id="t-sec">90</span>
  </div>
  <button class="timer-skip" onclick="skipTimer()">Пропустить</button>
  <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar-fill" style="width:100%"></div></div>
</div>

<div class="undo-toast" id="undo-toast">
  <span class="undo-text" id="undo-text">Подход засчитан</span>
  <button class="undo-btn" onclick="undoLastSet()">Отменить</button>
</div>

<div class="top-bar">
  <div>
    <div class="top-date" id="cur-date"></div>
    <div class="top-title" id="day-title">Workout</div>
  </div>
  <div class="week-badge" id="week-badge">0/4</div>
</div>

<div class="prog-wrap">
  <div class="prog-track" id="prog-track">
    <div class="prog-fill" id="prog-fill"></div>
    <button class="prog-seg" id="tab-mon" onclick="switchDay('mon')">ПН</button>
    <button class="prog-seg" id="tab-tue" onclick="switchDay('tue')">ВТ</button>
    <button class="prog-seg" id="tab-thu" onclick="switchDay('thu')">ЧТ</button>
    <button class="prog-seg" id="tab-fri" onclick="switchDay('fri')">ПТ</button>
  </div>
</div>

<div id="main-content"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.enableClosingConfirmation();
tg.setHeaderColor('#000000');

function enterFullscreen() {
    if (tg.isVersionAtLeast('7.0')) {
        if (tg.requestFullscreen) tg.requestFullscreen();
    }
}

document.addEventListener('click', enterFullscreen, { once: true });

const WORKOUTS = {
  mon:{ name:"Push / Pull", ss:[
    {id:"m1",sets:5,rest:120,ex:[{name:"Chest Press",w:70,reps:10},{name:"Lat Pulldown",w:70,reps:10}]},
    {id:"m2",sets:4,rest:90, ex:[{name:"Shoulder Press",w:60,reps:10},{name:"Cable Row",w:80,reps:10}]},
    {id:"m3",sets:4,rest:60, ex:[{name:"Preacher Curl",w:35,reps:12},{name:"Tricep Kickback",w:10,reps:12}]}
  ]},
  tue:{ name:"Lower — Hyper", ss:[
    {id:"t1",sets:4,rest:150,ex:[{name:"Leg Press",w:140,reps:10},{name:"Leg Curl",w:20,reps:12}]},
    {id:"t2",sets:3,rest:120,ex:[{name:"Hack Squat",w:90,reps:10},{name:"Leg Extension",w:25,reps:12}]},
    {id:"t3",sets:3,rest:60, ex:[{name:"DB Hammer Curls",w:12,reps:12},{name:"Tricep Pushdown",w:22,reps:12}]}
  ]},
  thu:{ name:"Incline Focus", ss:[
    {id:"h1",sets:4,rest:120,ex:[{name:"Incline DB Press",w:22,reps:10},{name:"Lat Pulldown Machine",w:70,reps:10}]},
    {id:"h2",sets:4,rest:90, ex:[{name:"Supported Row",w:80,reps:10},{name:"Lateral Raise",w:8,reps:15}]},
    {id:"h3",sets:4,rest:60, ex:[{name:"Preacher Curl",w:35,reps:12},{name:"Tricep Kickback",w:10,reps:12}]}
  ]},
  fri:{ name:"Lower — Mix", ss:[
    {id:"f1",sets:4,rest:150,ex:[{name:"Leg Press",w:140,reps:10},{name:"Leg Curl",w:20,reps:12}]},
    {id:"f2",sets:3,rest:120,ex:[{name:"Hack Squat",w:90,reps:10},{name:"Leg Extension",w:25,reps:12}]},
    {id:"f3",sets:3,rest:60, ex:[{name:"DB Hammer Curls",w:12,reps:12},{name:"Overhead Tricep",w:22,reps:12}]}
  ]}
};

const DAY_ORDER = ['mon','tue','thu','fri'];
const DAY_NAMES = {mon:'Понедельник',tue:'Вторник',thu:'Четверг',fri:'Пятница'};

function loadDB(){try{return JSON.parse(localStorage.getItem('fit_v10'))||{};}catch(e){return {};}}
function saveDB(){localStorage.setItem('fit_v10',JSON.stringify(db));}

let db = loadDB();
if(!db.progress)      db.progress={};
if(!db.doneDays)      db.doneDays={};
if(!db.weights)       db.weights={};
if(!db.weekVol)       db.weekVol={};
if(!db.prevWeights)   db.prevWeights={};
if(!db.weekHistory)   db.weekHistory=[];
if(!db.weekNum)       db.weekNum=1;
if(!db.personalRecords) db.personalRecords={};
if(!db.baseWeights)   db.baseWeights=initBaseWeights();

function initBaseWeights() {
  const base = {};
  DAY_ORDER.forEach(day => {
    WORKOUTS[day].ss.forEach(ss => {
      ss.ex.forEach(ex => {
        base[ex.name] = ex.w;
      });
    });
  });
  return base;
}

let currentDay = 'mon';
let timerInterval=null, timerLeft=0, undoTimeout=null, lastSetSnapshot=null;
let chartInstances={};

function getWeight(name,def){
  const key = currentDay + '_' + name;
  if(db.weights[key]!==undefined) return db.weights[key];
  return db.weights[name]!==undefined ? db.weights[name] : def;
}

function setWeight(name,w){
  const key = currentDay + '_' + name;
  db.weights[key] = Math.max(0, w);
  saveDB();
}

function getCurSet(id){return db.progress[id]||1;}

function switchDay(id){
  currentDay=id;
  window.scrollTo(0, 0);
  render();
}

/* ── PROGRESS BAR ── */
function renderTabs(){
  const doneCount = DAY_ORDER.filter(d=>db.doneDays[d]).length;
  document.getElementById('week-badge').innerText=`${doneCount}/4`;

  let lastDoneIdx = -1;
  DAY_ORDER.forEach((d,i)=>{ if(db.doneDays[d]) lastDoneIdx=i; });

  const fillPct = ((lastDoneIdx+1)/DAY_ORDER.length)*100;
  const fill = document.getElementById('prog-fill');
  fill.style.width = fillPct+'%';
  fill.style.borderRadius = fillPct>=100 ? '13px' : '13px 0 0 13px';

  DAY_ORDER.forEach((d,i)=>{
    const btn=document.getElementById('tab-'+d);
    const isDone=!!db.doneDays[d];
    const isActive=d===currentDay;
    btn.className='prog-seg'+(isDone?' done':'')+(isActive?' active':'');
  });
}

function render(){
  document.getElementById('day-title').innerText=WORKOUTS[currentDay].name;
  renderTabs();
  Object.values(chartInstances).forEach(c=>c.destroy());
  chartInstances={};

  const content=document.getElementById('main-content');
  content.innerHTML='';

  if(db.doneDays[currentDay]){renderReport(content);return;}

  const allDone=WORKOUTS[currentDay].ss.every(ss=>getCurSet(ss.id)>ss.sets);

  const lbl=document.createElement('div');
  lbl.className='section-label';
  lbl.innerText='Суперсеты';
  content.appendChild(lbl);

  WORKOUTS[currentDay].ss.forEach(ss=>{
    const curSet=getCurSet(ss.id);
    const isDone=curSet>ss.sets;
    renderSS(content,ss,curSet,isDone);
  });

  if(allDone){
    const wrap=document.createElement('div');
    wrap.className='finish-wrap';
    wrap.innerHTML=`<div class="section-label">Готово к завершению</div><button class="finish-btn" onclick="completeWorkout()">Завершить тренировку</button>`;
    content.appendChild(wrap);
  }
}

function renderSS(container,ss,curSet,isDone){
  const card=document.createElement('div');
  card.className='ss-card'+(isDone?' done-card':'');

  let bClass=isDone?'complete':curSet>1?'active':'pending';
  let bText=isDone?'✓ Выполнено':`Подход ${curSet} / ${ss.sets}`;

  let html=`<div class="ss-head"><span class="ss-label">Суперсет</span><span class="ss-badge ${bClass}">${bText}</span></div>`;

  if(!isDone){
    ss.ex.forEach(ex=>{
      const w=getWeight(ex.name,ex.w);
      html+=`
        <div class="ex-row">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-controls">
            <button class="btn-adj minus" onclick="adjustW('${ex.name.replace(/'/g,"\\'")}',-2.5)">−2.5</button>
            <div class="weight-display">
              <span class="weight-val">${w}</span>
              <span class="weight-unit">${ex.reps} повт × кг</span>
            </div>
            <button class="btn-adj" onclick="adjustW('${ex.name.replace(/'/g,"\\'")}',.+2.5)">+2.5</button>
            <button class="btn-edit" onclick="editW('${ex.name.replace(/'/g,"\\'")}',${ ex.w})">✎</button>
          </div>
        </div>`;
    });
    const isLast=curSet===ss.sets;
    html+=`<div class="set-btn-wrap"><button class="set-btn ${isLast?'last-set':'ready'}" onclick="logSet('${ss.id}',${ss.rest})">${isLast?'Последний подход — завершить':'Записать подход'}</button></div>`;
  } else {
    html+=`<div style="padding:14px 16px;color:var(--success);font-size:14px;font-weight:600;text-align:center">Суперсет завершён</div>`;
  }
  card.innerHTML=html;
  container.appendChild(card);
}

/* ─�� REPORT with CHARTS + NEW FEATURES ── */
function renderReport(container){
  const vol=db.weekVol[currentDay]||0;
  const kcal=Math.floor(vol*0.05+150);
  const idx=DAY_ORDER.indexOf(currentDay);
  const allWeekDone=DAY_ORDER.every(d=>db.doneDays[d]);

  const rep=document.createElement('div');
  rep.className='report';

  let html=`
    <div class="section-label" style="padding-left:0">Итоги тренировки</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${vol.toLocaleString()}</div><div class="stat-lbl">Объём, кг</div></div>
      <div class="stat-card"><div class="stat-num">${kcal}</div><div class="stat-lbl">Калории</div></div>
    </div>
  `;

  /* ФИЧА 4: ВИДЖЕТ СТАТИСТИКИ НЕДЕЛИ */
  if(allWeekDone) {
    const weekVol = Object.values(db.weekVol).reduce((a,b)=>a+b,0);
    const weekKcal = Math.floor(weekVol*0.05+600);
    const bestDay = Object.keys(db.weekVol).reduce((a,b)=>db.weekVol[b]>db.weekVol[a]?b:a,'mon');
    html+=`
      <div class="section-label" style="padding-left:0">Статистика недели</div>
      <div class="week-stats">
        <div class="week-stat-item">
          <div class="week-stat-value">${weekVol.toLocaleString()}</div>
          <div class="week-stat-label">Объём недели</div>
        </div>
        <div class="week-stat-item">
          <div class="week-stat-value">4/4</div>
          <div class="week-stat-label">Тренировки</div>
        </div>
        <div class="week-stat-item">
          <div class="week-stat-value">${weekKcal}</div>
          <div class="week-stat-label">Калории</div>
        </div>
        <div class="week-stat-item" style="background:rgba(50,215,75,.1);border-color:var(--success)">
          <div class="week-stat-value" style="color:var(--success)">${DAY_NAMES[bestDay]}</div>
          <div class="week-stat-label">Лучший день</div>
        </div>
      </div>
    `;
  }

  html+= `<div class="section-label" style="padding-left:0">Веса по упражнениям</div>`;

  const dayExercises=[];
  WORKOUTS[currentDay].ss.forEach(ss=>ss.ex.forEach(ex=>dayExercises.push({...ex, ssId: ss.id})));

  dayExercises.forEach((ex,i)=>{
    const chartId='chart-'+i;
    html+=`
      <div class="chart-card">
        <div class="chart-title">${ex.name}</div>
        <div class="chart-sub">${ex.reps} повторений</div>
        <div class="chart-wrap"><canvas id="${chartId}"></canvas></div>
      </div>`;
  });

  if(allWeekDone){
    html+=`
      <div class="week-end">
        <div class="week-end-icon">🔥</div>
        <div class="week-end-title">Неделя завершена!</div>
        <div class="week-end-sub">Все 4 тренировки выполнены</div>
      </div>
      <button class="next-btn reset" onclick="resetWeek()">Начать новую ��еделю</button>`;
  } else if(idx<DAY_ORDER.length-1){
    const next=DAY_ORDER[idx+1];
    html+=`<button class="next-btn primary" onclick="switchDay('${next}')">Перейти к ${DAY_NAMES[next]}</button>`;
  }

  rep.innerHTML=html;
  container.appendChild(rep);

  requestAnimationFrame(()=>{
    dayExercises.forEach((ex,i)=>{
      const chartId='chart-'+i;
      const canvas=document.getElementById(chartId);
      if(!canvas) return;

      const curW=getWeight(ex.name,ex.w);
      const prevW=db.prevWeights[ex.name]!==undefined?db.prevWeights[ex.name]:ex.w;
      const defaultW=ex.w;

      const hasPrev = db.prevWeights[ex.name]!==undefined;
      let labels, data, colors;

      if(hasPrev){
        labels=['Базовый','Прошлая','Эта'];
        data=[defaultW, prevW, curW];
      } else {
        labels=['Базовый','Эта неделя'];
        data=[defaultW, curW];
      }

      colors = data.map((v,i)=>{
        if(i<data.length-1) return 'rgba(142,142,147,0.4)';
        const prev=data[i-1]||v;
        if(v>prev) return 'rgba(50,215,75,0.85)';
        if(v<prev) return 'rgba(255,69,58,0.75)';
        return 'rgba(142,142,147,0.4)';
      });

      const diff=curW-(hasPrev?prevW:defaultW);
      const diffStr=diff===0?'без изменений':(diff>0?'+'+diff+'кг':diff+'кг');

      const sub=canvas.closest('.chart-card').querySelector('.chart-sub');
      sub.innerHTML=`${ex.reps} повт &nbsp;·&nbsp; <span style="color:${diff>0?'var(--success)':diff<0?'#FF453A':'var(--sec)'};font-weight:700">${diffStr}</span>`;

      const ctx=canvas.getContext('2d');
      chartInstances['chart-'+i]=new Chart(ctx,{
        type:'bar',
        data:{
          labels,
          datasets:[{
            data,
            backgroundColor:colors,
            borderRadius:8,
            borderSkipped:false,
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          plugins:{
            legend:{display:false},
            tooltip:{
              callbacks:{
                label:ctx=>`${ctx.parsed.y} кг`
              },
              backgroundColor:'#2C2C2E',
              titleColor:'#fff',
              bodyColor:'#8E8E93',
              padding:10,
              cornerRadius:10,
              displayColors:false,
            }
          },
          scales:{
            x:{
              ticks:{color:'#8E8E93',font:{size:11,weight:'600'}},
              grid:{display:false},
              border:{display:false}
            },
            y:{
              ticks:{
                color:'#8E8E93',font:{size:10},
                callback:v=>v+'кг',
                maxTicksLimit:4
              },
              grid:{color:'rgba(255,255,255,0.05)'},
              border:{display:false},
              suggestedMin: Math.min(...data)*0.85,
              suggestedMax: Math.max(...data)*1.15,
            }
          }
        }
      });
    });
  });
}

/* ── ACTIONS ── */
function adjustW(name,delta){
  const def = WORKOUTS[currentDay].ss.flatMap(s=>s.ex).find(e=>e.name===name)?.w||0;
  const cur=getWeight(name,def);
  setWeight(name,Math.round((cur+delta)*10)/10);
  render();
  haptic('light');
}

function editW(name,def){
  const cur=getWeight(name,def);
  const v=prompt(`Вес для "${name}" (кг):`,cur);
  if(v===null)return;
  const p=parseFloat(v);
  if(!isNaN(p)&&p>=0){setWeight(name,p);render();}
}

function logSet(ssId,rest){
  const ss=WORKOUTS[currentDay].ss.find(s=>s.id===ssId);
  const curSet=getCurSet(ssId);
  lastSetSnapshot={ssId,prevSet:curSet,prevVol:db.weekVol[currentDay]||0};
  let vol=0;
  ss.ex.forEach(ex=>{
    const w=getWeight(ex.name,ex.w);
    vol+=w*ex.reps;
    
    /* ФИЧА 2: ПРОВЕРКА РЕКОРДОВ */
    const prKey = ex.name;
    const prevBest = db.personalRecords[prKey]||db.baseWeights[ex.name]||ex.w;
    if(w > prevBest) {
      db.personalRecords[prKey] = w;
      showPRNotification(ex.name, w);
    }
  });
  
  db.progress[ssId]=curSet+1;
  db.weekVol[currentDay]=(db.weekVol[currentDay]||0)+vol;
  saveDB();
  haptic('medium');
  render();
  startTimer(rest);
  showUndo(`Подход ${curSet}/${ss.sets} засчитан`);
}

function undoLastSet(){
  if(!lastSetSnapshot)return;
  const{ssId,prevSet,prevVol}=lastSetSnapshot;
  db.progress[ssId]=prevSet;
  db.weekVol[currentDay]=prevVol;
  lastSetSnapshot=null;
  saveDB();
  skipTimer();
  hideUndo();
  render();
  haptic('light');
}

function completeWorkout(){
  db.doneDays[currentDay]=true;
  saveDB();
  haptic('success');
  render();
}

function resetWeek(){
  if(!confirm('Сбросить прогресс недели и начать заново?'))return;
  
  /* ФИЧА 1: СОХРАНЕНИЕ ИСТОРИИ НЕДЕЛЬ */
  const weekSnapshot = {
    weekNum: db.weekNum,
    date: new Date().toISOString(),
    volume: Object.values(db.weekVol).reduce((a,b)=>a+b,0),
    weights: {...db.weights},
    doneDays: {...db.doneDays}
  };
  db.weekHistory.push(weekSnapshot);
  
  db.prevWeights={...db.weights};
  db.weekNum=(db.weekNum||1)+1;
  db.progress={};
  db.doneDays={};
  db.weekVol={};
  saveDB();
  currentDay='mon';
  window.scrollTo(0, 0);
  render();
}

function showPRNotification(exName, weight){
  haptic('success');
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
  
  const notif = document.getElementById('pr-notification');
  document.getElementById('pr-exercise').innerText = exName;
  document.getElementById('pr-weight').innerText = weight + ' кг';
  notif.classList.add('show');
  document.getElementById('overlay').style.display='block';
  
  setTimeout(()=>{
    notif.classList.remove('show');
    document.getElementById('overlay').style.display='none';
  }, 2500);
}

function showUndo(msg){
  clearTimeout(undoTimeout);
  document.getElementById('undo-text').innerText=msg;
  document.getElementById('undo-toast').style.display='flex';
  undoTimeout=setTimeout(hideUndo,4000);
}

function hideUndo(){
  document.getElementById('undo-toast').style.display='none';
  lastSetSnapshot=null;
}

function startTimer(secs){
  clearInterval(timerInterval);
  timerLeft=secs;
  const pill=document.getElementById('timer-pill');
  pill.style.display='flex';
  document.getElementById('t-sec').innerText=timerLeft;
  const fill=document.getElementById('timer-bar-fill');
  fill.style.transition='none';
  fill.style.width='100%';
  setTimeout(()=>{
    fill.style.transition=`width ${secs}s linear`;
    fill.style.width='0%';
  },50);
  timerInterval=setInterval(()=>{
    timerLeft--;
    document.getElementById('t-sec').innerText=timerLeft;
    if(timerLeft<=3&&tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    if(timerLeft<=0){skipTimer();if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');}
  },1000);
}

function skipTimer(){
  clearInterval(timerInterval);
  timerInterval=null;
  document.getElementById('timer-pill').style.display='none';
}

function haptic(t){
  if(!tg?.HapticFeedback)return;
  if(t==='success')tg.HapticFeedback.notificationOccurred('success');
  else tg.HapticFeedback.impactOccurred(t);
}

document.getElementById('cur-date').innerText=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
render();
</script>
