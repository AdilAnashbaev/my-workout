<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitness OS Pro v7</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --card: #1C1C1E; --accent: #0A84FF; --success: #32D74B; 
            --warmup: #FF9F0A; --text: #FFF; --sec: #8E8E93; --border: #2C2C2E;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 16px 140px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .date-label { color: var(--sec); font-size: 12px; font-weight: 700; text-transform: uppercase; }
        
        .progress-nav { display: flex; background: #2C2C2E; border-radius: 14px; overflow: hidden; margin-bottom: 25px; height: 50px; border: 1px solid var(--border); }
        .day-tab { flex: 1; border: none; background: transparent; color: var(--sec); font-weight: 800; font-size: 14px; transition: 0.3s; cursor: pointer; }
        .day-tab.active { color: #fff; background: #48484A; }
        .day-tab.completed { background: var(--success) !important; color: #000 !important; }
        .day-tab:not(:last-child) { border-right: 1px solid #3A3A3C; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
        .ss-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .ss-title { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .set-badge { background: #2C2C2E; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: var(--success); font-weight: 700; }
        
        .ex-row { margin-bottom: 15px; border-bottom: 1px solid #2C2C2E; padding-bottom: 15px; }
        .ex-name { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .controls { display: flex; gap: 8px; }
        .btn-w { flex: 1; background: #2C2C2E; border: 1px solid var(--border); border-radius: 12px; padding: 12px 5px; color: white; text-align: center; }
        .btn-w.active { border-color: var(--accent); background: rgba(10,132,255,0.1); }
        .btn-edit { width: 50px; background: #2C2C2E; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; }

        .main-btn { background: var(--accent); color: white; width: 100%; border: none; padding: 20px; border-radius: 18px; font-size: 17px; font-weight: 700; margin-top: 10px; }
        
        #report-overlay { display: none; margin-top: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #1C1C1E; padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .stat-val { font-size: 22px; font-weight: 800; color: var(--success); }
        
        #timer-pill { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); padding: 12px 25px; border-radius: 100px; display: none; align-items: center; gap: 12px; z-index: 1000; box-shadow: 0 10px 25px rgba(10,132,255,0.4); }
    </style>
</head>
<body>

<div id="timer-pill" onclick="skipTimer()">
    <span style="font-weight: 800; font-size: 14px;">REST</span>
    <span id="t-sec" style="font-size: 18px; font-weight: 800;">90</span>
</div>

<div class="header">
    <div>
        <div class="date-label" id="cur-date"></div>
        <h1 id="day-display-name" style="margin: 0; font-size: 28px;">Workout</h1>
    </div>
</div>

<div class="progress-nav">
    <button class="day-tab" id="tab-mon" onclick="switchDay('mon')">ПН</button>
    <button class="day-tab" id="tab-tue" onclick="switchDay('tue')">ВТ</button>
    <button class="day-tab" id="tab-thu" onclick="switchDay('thu')">ЧТ</button>
    <button class="day-tab" id="tab-fri" onclick="switchDay('fri')">ПТ</button>
</div>

<div id="exercise-list"></div>

<div id="report-overlay">
    <h2 style="margin-bottom: 15px;">Отчет за сегодня 📊</h2>
    <div class="stat-grid">
        <div class="stat-box"><div class="stat-val" id="stat-vol">0</div><div style="font-size:11px; color:var(--sec)">ОБЪЕМ (КГ)</div></div>
        <div class="stat-box"><div class="stat-val" id="stat-kc">0</div><div style="font-size:11px; color:var(--sec)">КАЛОРИИ</div></div>
    </div>
    <div id="next-action-area"></div>
</div>

<button id="finish-btn" class="main-btn" style="background: var(--success); color: #000; display: none;" onclick="completeWorkout()">ЗАВЕРШИТЬ ТРЕНИРОВКУ</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// ПОЛНАЯ БАЗА ТРЕНИРОВОК
const workoutData = {
    mon: { name: "Upper / Push-Pull", ss: [
        { id: "mon_1", sets: 5, rest: 120, ex: [{ name: "Chest Press", w: 70 }, { name: "Lat Pulldown", w: 70 }] },
        { id: "mon_2", sets: 4, rest: 90, ex: [{ name: "Shoulder Press", w: 60 }, { name: "Cable Row", w: 80 }] },
        { id: "mon_3", sets: 4, rest: 60, ex: [{ name: "Preacher Curl", w: 35 }, { name: "Tricep Kickback", w: 10 }] }
    ]},
    tue: { name: "Lower / Hypertrophy", ss: [
        { id: "tue_1", sets: 4, rest: 150, ex: [{ name: "Leg Press", w: 140 }, { name: "Leg Curl", w: 20 }] },
        { id: "tue_2", sets: 3, rest: 120, ex: [{ name: "Hack Squat", w: 90 }, { name: "Leg Extension", w: 25 }] },
        { id: "tue_3", sets: 3, rest: 60, ex: [{ name: "DB Hammer Curls", w: 12 }, { name: "Tricep Pushdown", w: 22 }] }
    ]},
    thu: { name: "Upper / Incline Focus", ss: [
        { id: "thu_1", sets: 4, rest: 120, ex: [{ name: "Incline DB Press", w: 22 }, { name: "Lat Pulldown Machine", w: 70 }] },
        { id: "thu_2", sets: 4, rest: 90, ex: [{ name: "Supported Row", w: 80 }, { name: "Lateral Raise", w: 8 }] },
        { id: "thu_3", sets: 4, rest: 60, ex: [{ name: "Preacher Curl", w: 35 }, { name: "Tricep Kickback", w: 10 }] }
    ]},
    fri: { name: "Lower / Mix Finish", ss: [
        { id: "fri_1", sets: 4, rest: 150, ex: [{ name: "Leg Press", w: 140 }, { name: "Leg Curl", w: 20 }] },
        { id: "fri_2", sets: 3, rest: 120, ex: [{ name: "Hack Squat", w: 90 }, { name: "Leg Extension", w: 25 }] },
        { id: "fri_3", sets: 3, rest: 60, ex: [{ name: "DB Hammer Curls", w: 12 }, { name: "Overhead Tricep", w: 22 }] }
    ]}
};

const dayOrder = ['mon', 'tue', 'thu', 'fri'];
let db = JSON.parse(localStorage.getItem('fit_os_v7')) || { history: {}, progress: {}, doneDays: {} };
let currentDay = 'mon';
let sessionVolume = 0;
let timerInterval;

function save() { localStorage.setItem('fit_os_v7', JSON.stringify(db)); }

function switchDay(id) {
    currentDay = id;
    document.getElementById('report-overlay').style.display = 'none';
    render();
}

function render() {
    const day = workoutData[currentDay];
    document.getElementById('day-display-name').innerText = day.name;
    
    dayOrder.forEach(d => {
        const t = document.getElementById('tab-'+d);
        t.className = `day-tab ${d === currentDay ? 'active' : ''} ${db.doneDays[d] ? 'completed' : ''}`;
    });

    const list = document.getElementById('exercise-list');
    list.innerHTML = '';
    let dayFinished = true;

    day.ss.forEach(ss => {
        const curSet = db.progress[ss.id] || 1;
        const isDone = curSet > ss.sets;
        if(!isDone) dayFinished = false;

        const card = document.createElement('div');
        card.className = 'card';
        if(isDone) card.style.opacity = '0.3';

        let html = `<div class="ss-header"><span class="ss-title">SUPERSET</span><span class="set-badge">${isDone ? '✓' : 'SET '+curSet+'/'+ss.sets}</span></div>`;

        if(!isDone) {
            ss.ex.forEach(ex => {
                const hist = db.history[ex.name] || [];
                const currentW = hist.length > 0 ? hist[hist.length-1] : ex.w;
                html += `
                    <div class="ex-row">
                        <div class="ex-name">${ex.name}</div>
                        <div class="controls">
                            <div class="btn-w active"><b>${currentW}кг</b></div>
                            <div class="btn-w" onclick="addW('${ex.name}', 2.5)"><b>+2.5</b></div>
                            <div class="btn-edit" onclick="setW('${ex.name}')">✎</div>
                        </div>
                    </div>
                `;
            });
            html += `<button class="main-btn" onclick="nextSet('${ss.id}', ${ss.rest})">ЗАВЕРШИТЬ ПОДХОД</button>`;
        } else {
            html += `<div style="text-align:center; color:var(--success); font-weight:700">Выполнено</div>`;
        }
        card.innerHTML = html;
        list.appendChild(card);
    });

    document.getElementById('finish-btn').style.display = (dayFinished && !db.doneDays[currentDay]) ? 'block' : 'none';
}

function addW(name, v) {
    const h = db.history[name] || [workoutData[currentDay].ss.find(s=>s.ex.find(e=>e.name===name)).ex.find(e=>e.name===name).w];
    if(!db.history[name]) db.history[name] = [];
    db.history[name].push(h[h.length-1] + v);
    save(); render();
}

function setW(name) {
    const p = prompt("Введите вес:", "");
    if(p) { if(!db.history[name]) db.history[name] = []; db.history[name].push(parseFloat(p)); save(); render(); }
}

function nextSet(ssId, rest) {
    const ss = workoutData[currentDay].ss.find(s => s.id === ssId);
    ss.ex.forEach(ex => {
        const weight = db.history[ex.name]?.slice(-1)[0] || ex.w;
        sessionVolume += (weight * 10);
    });
    db.progress[ssId] = (db.progress[ssId] || 1) + 1;
    save(); startTimer(rest); render();
}

function startTimer(s) {
    clearInterval(timerInterval);
    const p = document.getElementById('timer-pill'); p.style.display = 'flex';
    let l = s; document.getElementById('t-sec').innerText = l;
    timerInterval = setInterval(() => { l--; document.getElementById('t-sec').innerText = l; if(l<=0) skipTimer(); }, 1000);
}

function skipTimer() { clearInterval(timerInterval); document.getElementById('timer-pill').style.display = 'none'; }

function completeWorkout() {
    db.doneDays[currentDay] = true;
    save();
    document.getElementById('exercise-list').innerHTML = '';
    document.getElementById('finish-btn').style.display = 'none';
    
    const rep = document.getElementById('report-overlay');
    rep.style.display = 'block';
    document.getElementById('stat-vol').innerText = sessionVolume;
    document.getElementById('stat-kc').innerText = Math.floor(sessionVolume * 0.04 + 120);

    const area = document.getElementById('next-action-area');
    const idx = dayOrder.indexOf(currentDay);
    
    if (idx < dayOrder.length - 1) {
        const next = dayOrder[idx + 1];
        area.innerHTML = `<button class="main-btn" onclick="switchDay('${next}')">ПЕРЕЙТИ К ${next === 'tue' ? 'ВТОРНИКУ' : next === 'thu' ? 'ЧЕТВЕРГУ' : 'ПЯТНИЦЕ'}</button>`;
    } else {
        area.innerHTML = `<div style="color:var(--success); text-align:center; margin:20px 0; font-weight:800">НЕДЕЛЯ ЗАВЕРШЕНА! 🔥</div>
                          <button class="main-btn" style="background:#fff; color:#000" onclick="resetAll()">НАЧАТЬ НОВУЮ НЕДЕЛЮ</button>`;
    }
    tg.HapticFeedback.notificationOccurred('success');
}

function resetAll() {
    if(confirm("Сбросить прогресс недели?")) {
        db.progress = {}; db.doneDays = {}; sessionVolume = 0; save(); switchDay('mon');
    }
}

document.getElementById('cur-date').innerText = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}).toUpperCase();
render();
</script>
</body>
</html>
