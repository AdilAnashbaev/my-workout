<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitness OS Ultra</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --card: #1C1C1E; --accent: #0A84FF; --success: #32D74B; 
            --warmup: #FF9F0A; --text: #FFF; --sec: #8E8E93; --border: #2C2C2E;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 16px 140px; }
        
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .date-label { color: var(--sec); font-size: 12px; font-weight: 700; text-transform: uppercase; }
        
        /* Прогресс-бар из дней */
        .progress-nav { display: flex; background: #2C2C2E; border-radius: 14px; overflow: hidden; margin-bottom: 25px; height: 50px; border: 1px solid var(--border); }
        .day-tab { flex: 1; border: none; background: transparent; color: var(--sec); font-weight: 800; font-size: 14px; transition: 0.3s; position: relative; cursor: pointer; }
        .day-tab.active { color: #fff; background: #48484A; }
        .day-tab.completed { background: var(--success) !important; color: #000 !important; }
        .day-tab:not(:last-child) { border-right: 1px solid #3A3A3C; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
        .ss-title { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .set-badge { background: #2C2C2E; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: var(--success); font-weight: 700; }
        
        .ex-row { margin-bottom: 15px; border-bottom: 1px solid #2C2C2E; padding-bottom: 15px; }
        .ex-name { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        
        .controls { display: flex; gap: 8px; }
        .btn-w { flex: 1; background: #2C2C2E; border: 1px solid var(--border); border-radius: 12px; padding: 12px 5px; color: white; text-align: center; }
        .btn-w.active { border-color: var(--accent); background: rgba(10,132,255,0.1); }
        .btn-w b { display: block; font-size: 16px; }
        .btn-edit { width: 50px; background: #2C2C2E; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; }

        .main-btn { background: var(--accent); color: white; width: 100%; border: none; padding: 20px; border-radius: 18px; font-size: 17px; font-weight: 700; margin-top: 10px; box-shadow: 0 4px 15px rgba(10,132,255,0.2); }
        
        /* Отчет в конце */
        #report-overlay { display: none; margin-top: 20px; animation: slideUp 0.5s ease; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #1C1C1E; padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .stat-val { font-size: 22px; font-weight: 800; color: var(--success); }
        .stat-label { font-size: 11px; color: var(--sec); text-transform: uppercase; margin-top: 4px; }

        #timer-pill { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); padding: 12px 25px; border-radius: 100px; display: none; align-items: center; gap: 12px; z-index: 1000; box-shadow: 0 10px 25px rgba(10,132,255,0.4); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="timer-pill" onclick="skipTimer()">
    <span id="t-label" style="font-weight: 800; font-size: 14px;">REST</span>
    <span id="t-sec" style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums;">90</span>
</div>

<div class="header">
    <div>
        <div class="date-label" id="cur-date"></div>
        <h1 id="day-name" style="margin: 0; font-size: 32px;">Workout</h1>
    </div>
</div>

<div class="progress-nav">
    <button class="day-tab" id="tab-mon" onclick="switchDay('mon')">ПН</button>
    <button class="day-tab" id="tab-tue" onclick="switchDay('tue')">ВТ</button>
    <button class="day-tab" id="tab-thu" onclick="switchDay('thu')">ЧТ</button>
    <button class="day-tab" id="tab-fri" onclick="switchDay('fri')">ПТ</button>
</div>

<div id="exercise-list"></div>

<div id="report-overlay">
    <h2 style="margin-bottom: 15px;">Workout Report 📊</h2>
    <div class="stat-grid">
        <div class="stat-box"><div class="stat-val" id="stat-volume">0</div><div class="stat-label">Volume (kg)</div></div>
        <div class="stat-box"><div class="stat-val" id="stat-kcal">0</div><div class="stat-label">Est. Calories</div></div>
    </div>
    <div class="card"><canvas id="reportChart" style="max-height: 150px;"></canvas></div>
    <div id="next-action-area"></div>
</div>

<button id="finish-btn" class="main-btn" style="background: var(--success); color: #000; display: none;" onclick="completeWorkout()">FINISH WORKOUT</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const workoutData = {
    mon: { name: "Upper / Push-Pull", order: 0, ss: [
        { id: "m1", sets: 5, rest: 120, ex: [{ name: "Chest Press", work: {w:70, r:8} }, { name: "Lat Pulldown", work: {w:70, r:8} }] },
        { id: "m2", sets: 4, rest: 90, ex: [{ name: "Shoulder Press", work: {w:60, r:8} }, { name: "Cable Row", work: {w:80, r:8} }] }
    ]},
    tue: { name: "Lower / Hypertrophy", order: 1, ss: [
        { id: "t1", sets: 4, rest: 150, ex: [{ name: "Leg Press", work: {w:140, r:10} }, { name: "Leg Curl", work: {w:20, r:10} }] }
    ]},
    thu: { name: "Upper / Incline", order: 2, ss: [
        { id: "h1", sets: 4, rest: 120, ex: [{ name: "Incline DB Press", work: {w:22, r:10} }, { name: "Lat Pulldown", work: {w:70, r:8} }] }
    ]},
    fri: { name: "Lower / Mix", order: 3, ss: [
        { id: "f1", sets: 4, rest: 150, ex: [{ name: "Leg Press", work: {w:140, r:10} }, { name: "Leg Curl", work: {w:20, r:10} }] }
    ]}
};

let db = JSON.parse(localStorage.getItem('fit_os_v6')) || { history: {}, progress: {}, doneDays: {} };
let currentDay = 'mon';
let sessionLogs = []; // Лог текущей тренировки для отчета
let timerInterval;

function save() { localStorage.setItem('fit_os_v6', JSON.stringify(db)); }

function switchDay(id) {
    currentDay = id;
    document.getElementById('report-overlay').style.display = 'none';
    render();
}

function render() {
    const day = workoutData[currentDay];
    document.getElementById('day-name').innerText = day.name;
    
    // Обновляем прогресс-бар (табы)
    Object.keys(workoutData).forEach(d => {
        const tab = document.getElementById('tab-'+d);
        tab.className = `day-tab ${d === currentDay ? 'active' : ''} ${db.doneDays[d] ? 'completed' : ''}`;
    });

    const list = document.getElementById('exercise-list');
    list.innerHTML = '';
    let allFinished = true;

    day.ss.forEach(ss => {
        const curSet = db.progress[ss.id] || 1;
        const isDone = curSet > ss.sets;
        if(!isDone) allFinished = false;

        const card = document.createElement('div');
        card.className = 'card';
        if(isDone) card.style.opacity = '0.3';

        let html = `<div style="display:flex; justify-content:space-between; margin-bottom:15px"><span class="ss-title">Superset</span><span class="set-badge">${isDone ? 'DONE' : 'SET '+curSet+'/'+ss.sets}</span></div>`;

        if(!isDone) {
            ss.ex.forEach(ex => {
                const hist = db.history[ex.name] || [];
                const lastW = hist.length > 0 ? hist[hist.length-1] : ex.work.w;
                html += `
                    <div class="ex-row">
                        <div class="ex-name">${ex.name}</div>
                        <div class="controls">
                            <div class="btn-w active"><b>${lastW}kg</b><i>Weight</i></div>
                            <div class="btn-w" onclick="quickAdd('${ex.name}', 2.5)"><b>+2.5</b></div>
                            <div class="btn-edit" onclick="manualEdit('${ex.name}')">✎</div>
                        </div>
                    </div>
                `;
            });
            html += `<button class="main-btn" onclick="finishSet('${ss.id}', ${ss.rest})">COMPLETE SET</button>`;
        }
        card.innerHTML = html;
        list.appendChild(card);
    });

    document.getElementById('finish-btn').style.display = (allFinished && !db.doneDays[currentDay]) ? 'block' : 'none';
}

function quickAdd(name, val) {
    const hist = db.history[name] || [0];
    const newW = hist[hist.length-1] + val;
    if(!db.history[name]) db.history[name] = [];
    db.history[name].push(newW);
    render();
}

function manualEdit(name) {
    const w = prompt("Weight:", "");
    if(w) { 
        if(!db.history[name]) db.history[name] = [];
        db.history[name].push(parseFloat(w));
        render(); 
    }
}

function finishSet(ssId, rest) {
    const ss = workoutData[currentDay].ss.find(s => s.id === ssId);
    ss.ex.forEach(ex => {
        const w = db.history[ex.name]?.slice(-1)[0] || ex.work.w;
        sessionLogs.push({ name: ex.name, weight: w, reps: 10 });
    });
    db.progress[ssId] = (db.progress[ssId] || 1) + 1;
    save();
    startTimer(rest);
    render();
}

function startTimer(s) {
    clearInterval(timerInterval);
    const pill = document.getElementById('timer-pill');
    pill.style.display = 'flex';
    let left = s;
    document.getElementById('t-sec').innerText = left;
    timerInterval = setInterval(() => {
        left--;
        document.getElementById('t-sec').innerText = left;
        if(left <= 0) skipTimer();
    }, 1000);
}

function skipTimer() {
    clearInterval(timerInterval);
    document.getElementById('timer-pill').style.display = 'none';
}

function completeWorkout() {
    db.doneDays[currentDay] = true;
    save();
    showReport();
    tg.HapticFeedback.notificationOccurred('success');
}

function showReport() {
    document.getElementById('exercise-list').innerHTML = '';
    document.getElementById('finish-btn').style.display = 'none';
    const report = document.getElementById('report-overlay');
    report.style.display = 'block';

    let totalVolume = 0;
    sessionLogs.forEach(l => totalVolume += (l.weight * l.reps));
    document.getElementById('stat-volume').innerText = totalVolume;
    document.getElementById('stat-kcal').innerText = Math.floor(totalVolume * 0.05 + 150); // Примерный расчет

    // График объема в отчете
    const ctx = document.getElementById('reportChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: sessionLogs.map(l => l.name.substring(0,6)),
            datasets: [{ label: 'kg', data: sessionLogs.map(l => l.weight), backgroundColor: '#0A84FF', borderRadius: 5 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#8E8E93' } } } }
    });

    // Логика следующего шага
    const actionArea = document.getElementById('next-action-area');
    const days = Object.keys(workoutData);
    const currentIndex = days.indexOf(currentDay);
    
    if (currentIndex < days.length - 1) {
        const nextDay = days[currentIndex + 1];
        actionArea.innerHTML = `<button class="main-btn" onclick="switchDay('${nextDay}')">GO TO ${nextDay.toUpperCase()}</button>`;
    } else {
        actionArea.innerHTML = `
            <div style="text-align:center; margin: 20px 0; color: var(--success); font-weight: 800;">WEEK COMPLETE! 🔥</div>
            <button class="main-btn" style="background:#fff; color:#000;" onclick="resetWeek()">START NEXT WEEK</button>
        `;
    }
}

function resetWeek() {
    if(confirm("Начать новую неделю?")) {
        db.progress = {};
        db.doneDays = {};
        save();
        sessionLogs = [];
        switchDay('mon');
    }
}

document.getElementById('cur-date').innerText = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'}).toUpperCase();
render();
</script>
</body>
</html>
