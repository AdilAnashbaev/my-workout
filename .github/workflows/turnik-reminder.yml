name: Напоминание про турник

# Шлёт 5 сообщений в Telegram по будням (Пн-Чт) в 9:33, 10:33, 11:33, 12:33 и 13:33 по
# времени Алматы (UTC+5, круглый год без перехода на летнее/зимнее время — поэтому смещение
# в cron ниже не нужно будет менять по сезонам). В пятницу и выходные турника в программе
# нет, поэтому напоминания тоже не шлются.

on:
  schedule:
    - cron: '33 4 * * 1-4'  # 09:33 Алматы
    - cron: '33 5 * * 1-4'  # 10:33 Алматы
    - cron: '33 6 * * 1-4'  # 11:33 Алматы
    - cron: '33 7 * * 1-4'  # 12:33 Алматы
    - cron: '33 8 * * 1-4'  # 13:33 Алматы
  workflow_dispatch: {}      # кнопка "Run workflow" в вкладке Actions — удобно для проверки вручную

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить напоминание в Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🚪 Турник: ещё один подход. Не до отказа — должно остаться ощущение, что можешь столько же ещё раз."
